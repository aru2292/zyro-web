name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          mkdir -p _site
          for z in *.zip; do unzip -o "$z" -d _site; done
          if [ $(ls _site | wc -l) -eq 1 ] && [ -d _site/$(ls _site) ]; then
            mv _site/$(ls _site)/* _site/ && rmdir _site/$(ls _site) || true
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
